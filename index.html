<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>題目在哪兒</title>
<style>
:root{--bg:#241a3d;--side:#1a1230;--panel:#30244f;--panel2:#3a2d5f;--line:#4d3f77;--ink:#f6efe8;--mute:#b9aed4;--or:#ffb585;--or2:#ffd9bd;--dark:#241a3d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 "PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--side);padding:26px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;border-right:1px solid var(--line)}
aside h1{margin:0 0 2px 8px;font-size:1.7rem;letter-spacing:.12em;color:var(--or2)}
aside .sub{margin:0 0 18px 8px;color:var(--mute);font-size:.82rem}
aside nav button{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;color:var(--mute);padding:11px 14px;font:inherit;font-weight:700;cursor:pointer;border-radius:0 8px 8px 0}
aside nav button:hover{background:var(--panel)}
aside nav button.on{color:var(--or);border-color:var(--or);background:var(--panel)}
#who{margin-top:auto;font-size:.82rem;color:var(--mute);padding:10px 8px;border-top:1px solid var(--line)}
main{padding:28px 36px 48px;min-width:0}
section{display:none}section.on{display:block}
h2{font-size:1.1rem;margin:0 0 12px;color:var(--or2)}
h3{margin:0 0 8px;font-size:1.5rem;color:var(--or2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}
.cols{display:grid;gap:20px;align-items:start}
.c-home{grid-template-columns:minmax(0,1.9fr) minmax(280px,1fr)}
.c-make{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}
.c-bank{grid-template-columns:340px minmax(0,1fr)}
label{display:block;font-size:.82rem;color:var(--mute);margin:9px 0 3px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 10px;font:inherit}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--or);outline-offset:1px}
.btn{background:var(--or);color:var(--dark);border:0;border-radius:8px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn:hover{background:var(--or2)}
.btn.ghost{background:none;color:var(--or);border:1px solid var(--or)}
.btn.ghost:hover{background:var(--panel2)}
.btn.sm{padding:3px 10px;font-size:.8rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1;min-width:110px}.row .btn{flex:none}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tabs{display:flex;gap:6px;margin-bottom:6px}.tabs .btn{flex:1}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-h b{font-size:1.3rem;color:var(--or2)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dow{text-align:center;color:var(--mute);font-size:.82rem}
.day{min-height:92px;background:var(--panel2);border:1px solid transparent;border-radius:8px;color:var(--ink);font:inherit;cursor:pointer;padding:5px 6px;text-align:left;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.day:hover{border-color:var(--or)}
.day.empty{background:none;cursor:default;border:0}
.day.today .n{color:var(--or);font-weight:800}
.day.sel{border-color:var(--or2);background:#4a3a78}
.day .ev{font-size:.72rem;background:var(--or);color:var(--dark);border-radius:4px;padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .more{font-size:.7rem;color:var(--mute)}
.item{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.item .t{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{display:inline-block;font-size:.74rem;border:1px solid var(--or);color:var(--or);border-radius:20px;padding:0 9px;margin:0 6px 3px 0}
.ans{color:var(--mute);font-size:.86rem}
.empty-msg{color:var(--mute);padding:6px 0}
.hint{color:var(--mute);font-size:.8rem;margin-top:4px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--or);color:var(--dark);padding:9px 20px;border-radius:24px;font-weight:700;display:none;z-index:30}
#login{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:20}
#login .card{width:360px;max-width:92vw}
#liErr{color:#ff9d9d;min-height:1.4em;font-size:.85rem}
.mbar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:12px 16px}
.tb{position:sticky;top:0;z-index:5;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 8px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:14px}
.tb button,.tb .cl{background:none;border:0;color:var(--ink);min-width:32px;height:32px;border-radius:6px;font:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:2px;padding:0 6px}
.tb button:hover,.tb .cl:hover{background:var(--panel)}
.tb select{width:auto;padding:4px 6px}
.tb input[type=color]{width:24px;height:24px;padding:0;border:0;background:none;cursor:pointer}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.wrap{overflow:auto;background:#171028;border-radius:12px;padding:24px}
#doc{width:794px;max-width:100%;min-height:1123px;margin:0 auto;padding:64px 72px;box-shadow:0 4px 24px #0008;outline:none}
#doc,#stage{color:#000;background:#fff;font:12pt/1.8 "Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;word-break:break-word}
#doc h2,#stage h2{font-size:20pt;margin:0 0 14px}#doc h3,#stage h3{font-size:15pt;margin:0 0 8px}
#doc p,#doc div,#stage p,#stage div{margin:0}
#doc ol,#doc ul,#stage ol,#stage ul{margin:0;padding-left:2em}
#doc li,#stage li{margin:0 0 10px}
@media(max-width:900px){#doc{padding:28px 20px;min-height:600px}.wrap{padding:10px}}
.fbar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}.fbar>div{flex:1;min-width:120px}.fbar label{margin-top:0}
.lhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}.lhead h2{margin:0}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}.th{position:relative}.th img{height:70px;border-radius:6px;border:1px solid var(--line);background:#fff;display:block}
.th button{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;border:0;background:var(--or);color:var(--dark);cursor:pointer;font-weight:700;line-height:1}
img.qimg{float:right;max-width:3cm;max-height:3cm;width:auto;height:auto;margin:0 0 6px 12px;border-radius:4px;background:#fff}
.item .t::after{content:"";display:block;clear:both}
#doc img,#stage img{max-width:70%;height:auto}
#doc li img,#stage li img{float:right;max-width:3cm;max-height:3cm;width:auto;height:auto;margin:0 0 4px 12px}
#doc li::after,#stage li::after{content:"";display:block;clear:both}
.lact{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:4px}
#bList{max-height:calc(100vh - 330px);min-height:280px;overflow-y:auto;padding-right:6px}
label.item{cursor:pointer;margin:0;color:var(--ink);font-size:inherit;display:flex}
.item input[type=checkbox]{width:18px;height:18px;margin-top:5px;flex:none;accent-color:#ffb585}
#bulk{position:fixed;inset:0;background:#241a3dee;display:none;align-items:center;justify-content:center;z-index:20}
#bulk .card{width:440px;max-width:92vw;margin:0}
@media(max-width:900px){
 .app{grid-template-columns:1fr}
 aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px}
 aside .sub{display:none}aside h1{margin:0 12px 0 0;font-size:1.3rem}
 aside nav{display:flex;overflow-x:auto}aside nav button{border-left:0;border-bottom:3px solid transparent;border-radius:0}
 aside nav button.on{border-bottom-color:var(--or)}
 #who{margin:0 0 0 auto;border:0;padding:0}
 main{padding:18px 14px 40px}
 .c-home,.c-make,.c-bank{grid-template-columns:1fr}
 .day{min-height:54px}.day .ev{display:none}
}
</style>
</head>
<body>
<div class="app">
<aside>
 <h1>題目在哪兒</h1>
 <p class="sub">考古題整理與出題參考</p>
 <nav id="nav">
  <button data-p="home" class="on">首頁</button>
  <button data-p="make">出題</button>
  <button data-p="rec">出卷紀錄</button>
  <button data-p="bank">考古題總集</button>
 </nav>
 <div id="who"><div id="whoT"></div><button class="btn ghost sm" id="setBtn" style="margin-top:8px">⚙ 設定</button></div>
</aside>
<main>

<section id="home" class="on">
 <div class="cols c-home">
  <div class="card">
   <div class="cal-h"><button class="btn ghost sm" id="prev">上個月</button><b id="mlabel"></b><button class="btn ghost sm" id="next">下個月</button></div>
   <div class="grid" id="dows"></div>
   <div class="grid" id="cal" style="margin-top:5px"></div>
  </div>
  <div class="card">
   <h2 id="dlabel">選擇日期</h2>
   <label for="evT">考卷名稱</label><input id="evT" placeholder="例如：國文第二次段考">
   <div class="bar"><button class="btn" id="evAdd">新增考試</button></div>
   <div id="evList" style="margin-top:8px"></div>
  </div>
 </div>
</section>

<section id="make">
 <div class="card mbar">
  <span>目前 <b id="mCount">0</b> 題</span>
  <label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" id="withAns" style="width:auto"> 輸出時附上答案頁</label>
  <div class="bar" style="margin:0 0 0 auto">
   <button class="btn ghost" id="toBank">從考古題總集挑題</button>
   <button class="btn" id="mSave">存到出卷紀錄</button>
   <button class="btn ghost" id="mUpd" style="display:none">更新原紀錄</button>
   <button class="btn ghost" id="mPdf">輸出 PDF</button>
   <button class="btn ghost" id="mDoc">輸出 Word 檔</button>
   <button class="btn ghost" id="mClear">清空</button>
  </div>
 </div>
 <div class="tb" id="tb">
  <button data-c="undo" title="復原">↶</button><button data-c="redo" title="重做">↷</button><span class="sep"></span>
  <select id="tBlk" title="段落樣式"><option value="">段落</option><option value="&lt;p&gt;">內文</option><option value="&lt;h2&gt;">標題</option><option value="&lt;h3&gt;">小標題</option></select>
  <select id="tFont" title="字型"><option value="">字型</option><option value="'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif">黑體</option><option value="PMingLiU,'Songti TC','Noto Serif TC',serif">明體</option><option value="DFKai-SB,BiauKai,KaiTi,serif">標楷體</option><option value="Arial,sans-serif">Arial</option><option value="'Times New Roman',serif">Times New Roman</option></select>
  <select id="tSize" title="字級"><option value="">大小</option><option>10pt</option><option>12pt</option><option>14pt</option><option>16pt</option><option>18pt</option><option>24pt</option><option>32pt</option></select><span class="sep"></span>
  <button data-c="bold" title="粗體"><b>B</b></button><button data-c="italic" title="斜體"><em>I</em></button><button data-c="underline" title="底線"><u>U</u></button><button data-c="strikeThrough" title="刪除線"><s>S</s></button><span class="sep"></span>
  <label class="cl" title="文字顏色">A<input type="color" id="tCol" value="#c0392b"></label>
  <label class="cl" title="螢光標示">底<input type="color" id="tBg" value="#ffee58"></label><span class="sep"></span>
  <button data-c="justifyLeft" title="靠左">☰</button><button data-c="justifyCenter" title="置中">≡</button><button data-c="justifyRight" title="靠右">☷</button><span class="sep"></span>
  <button data-c="insertOrderedList" title="編號清單">1.</button><button data-c="insertUnorderedList" title="項目符號">•</button><span class="sep"></span>
  <button data-c="removeFormat" title="清除格式">Tx</button><button id="tImgBtn" title="插入圖片">🖼</button><input type="file" id="tImg" accept="image/*" style="display:none">
 </div>
 <div class="wrap"><div id="doc" contenteditable="true" spellcheck="false"></div></div>
</section>

<section id="rec">
 <div class="card"><h2>出卷紀錄（只有你自己看得到）</h2><div id="recList"></div></div>
</section>

<section id="bank">
 <div class="card fbar">
  <div><label for="fY">年份</label><select id="fY"></select></div>
  <div><label for="fC">科目</label><select id="fC"></select></div>
  <div><label for="fT">題型</label><select id="fT"></select></div>
  <div><label for="fU">單元</label><select id="fU"></select></div>
  <div style="flex:2"><label for="fK">關鍵字</label><input id="fK" placeholder="搜尋題目內容"></div>
  <button class="btn" id="addToggle">＋ 新增考古題</button>
 </div>
 <div class="card" id="addBox" style="display:none">
  <h2 id="addH">新增考古題</h2>
  <div class="tabs" style="max-width:260px"><button class="btn sm" id="tS">單題</button><button class="btn ghost sm" id="tB">批量</button></div>
  <div class="row">
   <div><label for="bY">年份</label><input id="bY" type="number" placeholder="2025"></div>
   <div><label for="bC">科目</label><input id="bC" list="subs" placeholder="國文"></div>
   <div><label for="bT">題型</label><input id="bT" list="types" placeholder="選擇題"></div>
   <div><label for="bU">單元</label><input id="bU" list="units" placeholder="例如：第三課"></div>
  </div>
  <datalist id="subs"></datalist><datalist id="types"></datalist><datalist id="units"></datalist>
  <div id="oneBox">
   <label for="bQ">題目</label><textarea id="bQ"></textarea>
   <label for="bImg">圖片（選填，每題最多 4 張）</label><input id="bImg" type="file" accept="image/*" multiple>
   <div class="thumbs" id="bThumbs"></div>
   <label for="bA">答案（選填）</label><input id="bA">
   <div class="bar"><button class="btn" id="bAdd">新增題目</button><button class="btn ghost" id="bCancel" style="display:none">取消編輯</button></div>
  </div>
  <div id="batBox" style="display:none">
   <label for="bB">貼上多題，每題之間空一行</label>
   <textarea id="bB" style="min-height:200px" placeholder="1. 下列何者正確？&#10;(A) 甲 (B) 乙 (C) 丙 (D) 丁&#10;答案：B&#10;&#10;2. 台灣最高的山是＿＿＿。&#10;答案：玉山"></textarea>
   <div class="hint">答案寫在題目下方，以「答案：」開頭；題號會自動去掉。年份、科目、題型、單元會套用到這批所有題目。批量新增不含圖片，圖片請用單題新增或之後編輯加入。<span id="bCnt"></span></div>
   <div class="bar"><button class="btn" id="bBAdd">批量新增</button></div>
  </div>
 </div>
 <div class="card">
  <div class="lhead"><h2>題目清單（<span id="bN">0</span> 題・考卷已有 <span id="bD">0</span> 題）</h2>
   <div><label for="sortSel" style="display:inline;margin-right:6px">排序</label><select id="sortSel" style="width:auto"><option value="">預設（新增順序）</option><option value="use">出題次數（多→少）</option></select></div></div>
  <div class="lact">
   <label style="display:flex;gap:6px;align-items:center;margin:0;color:var(--ink)"><input type="checkbox" id="selAll" style="width:auto"> 全選</label>
   <span class="ans" id="selN">已選 0 題</span>
   <div class="bar" style="margin:0 0 0 auto"><button class="btn sm" id="bAddDoc">加入考卷</button><button class="btn ghost sm" id="bEdit">編輯</button><button class="btn ghost sm" id="bDel">刪除</button><button class="btn ghost sm" id="bFmt">整理選擇題格式</button></div>
  </div>
  <div id="bList"></div>
 </div>
</section>

</main>
</div>

<div id="login"><div class="card">
 <h3>設定</h3>
 <div id="stT" class="ans" style="margin-bottom:12px"></div>
 <div id="liErr"></div>
 <div class="bar" style="margin-top:4px"><button class="btn" id="liBtn" style="width:100%;padding:11px">使用 Google 帳號登入</button></div>
 <div class="bar"><button class="btn ghost" id="outBtn" style="width:100%">登出</button></div>
 <div class="bar"><button class="btn ghost" id="setClose" style="width:100%">關閉</button></div>
</div></div>
<div id="bulk"><div class="card">
 <h3>批量修改（已選 <span id="bkN">0</span> 題）</h3>
 <div class="hint">留空代表不更改，填了就會套用到所有已選題目。</div>
 <div class="row"><div><label for="bkY">年份</label><input id="bkY" type="number"></div><div><label for="bkC">科目</label><input id="bkC" list="subs"></div></div>
 <div class="row"><div><label for="bkT">題型</label><input id="bkT" list="types"></div><div><label for="bkU">單元</label><input id="bkU" list="units"></div></div>
 <div class="bar"><button class="btn" id="bkOk">套用</button><button class="btn ghost" id="bkNo">取消</button></div>
</div></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
/* ===== 雲端設定：貼上 Firebase 的 firebaseConfig（沒填就是單機模式） ===== */
var CFG={apiKey:"AIzaSyBtSDbVU2V2r73duPrp9shdADx0CeEhTAg",authDomain:"where-stest.firebaseapp.com",projectId:"where-stest",appId:"1:701745866064:web:daddb3230eec08b12e7855"};
/* =========================================================================== */
var FB="https://www.gstatic.com/firebasejs/10.14.1/";
var TYPES=["選擇題","填充題","是非題","簡答題","問答題","計算題"];
var LK="tmzne_v2";
var S={events:[],bank:[],papers:[]};
var L={draft:[],title:"",pid:null};
var C=null,user=null,unsubs=[],editId=null;
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function pad(n){return n<10?"0"+n:""+n}
function ds(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function toast(t){var e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display="none"},2600)}
function who(){return user?(user.displayName||user.email.split("@")[0]):"本機"}
function saveL(){try{var o=JSON.parse(localStorage.getItem(LK)||"{}");o.L=L;if(!user)o.S=S;localStorage.setItem(LK,JSON.stringify(o))}catch(e){}}
function loadL(){try{var o=JSON.parse(localStorage.getItem(LK)||"{}");if(o.L)L=Object.assign(L,o.L);if(o.S)S=Object.assign(S,o.S)}catch(e){}}

/* ---------- data layer ---------- */
function ref(col,id){return C.F.doc.apply(null,[C.db].concat(col==="bank"?[col]:["users",user.uid,col],[id]))}
function cref(col){return C.F.collection.apply(null,[C.db].concat(col==="bank"?[col]:["users",user.uid,col]))}
async function delMany(col,ids){
 if(C&&user){await Promise.all(ids.map(function(id){return C.F.deleteDoc(ref(col,id))}))}
 else{S[col]=S[col].filter(function(x){return ids.indexOf(x.id)<0});saveL();renderAll()}
}
async function putMany(col,arr){
 arr.forEach(function(o){o.ts=o.ts||Date.now();o.by=o.by||who()});
 if(C&&user){await Promise.all(arr.map(function(o){return C.F.setDoc(ref(col,o.id),o)}))}
 else{arr.forEach(function(o){var i=S[col].findIndex(function(x){return x.id===o.id});if(i>-1)S[col][i]=o;else S[col].unshift(o)});saveL();renderAll()}
}
async function del(col,id){
 if(C&&user)await C.F.deleteDoc(ref(col,id));
 else{S[col]=S[col].filter(function(x){return x.id!==id});saveL();renderAll()}
}
function act(p){return p.catch(function(e){toast("操作失敗："+(e.code||e.message))})}

  z.file("word/document.xml",X+'<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"><w:body>'+out.join("")+'<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr></w:body></w:document>');
  var blob=await z.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=(title||"考卷")+".docx";document.body.appendChild(a);a.click();a.remove();
  toast("Word 檔已下載");
 }catch(e){toast("Word 產生失敗："+e.message)}
}
$("mPdf").onclick=function(){toPdf(docTitle(ed.innerHTML),ed.innerHTML)};
$("mDoc").onclick=function(){toDoc(docTitle(ed.innerHTML),ed.innerHTML)};

/* ---------- 出卷紀錄 ---------- */
function paperHtml(p){return p.html||fromItems(p.title,p.items)}
function cntOf(p){return p.html?(p.html.match(/<li/g)||[]).length:(p.items||[]).length}
function renderRec(){
 $("recList").innerHTML=S.papers.length?S.papers.map(function(p){return '<div class="item"><div class="t"><b>'+esc(p.title)+'</b><div class="ans">'+esc(p.date)+"・"+cntOf(p)+" 題"+'</div></div><div class="acts"><button class="btn sm" data-ld="'+p.id+'">載入編輯</button><button class="btn ghost sm" data-pf="'+p.id+'">PDF</button><button class="btn ghost sm" data-dc="'+p.id+'">Word</button><button class="btn ghost sm" data-dl="'+p.id+'">刪除</button></div></div>'}).join(""):'<div class="empty-msg">還沒有紀錄。在「出題」頁按「存到出卷紀錄」就會出現在這裡。</div>';
 function find(id){return S.papers.filter(function(p){return p.id===id})[0]}
 $("recList").querySelectorAll("[data-ld]").forEach(function(b){b.onclick=function(){var p=find(b.dataset.ld);ed.innerHTML=paperHtml(p);L.pid=p.id;sync();renderDraft();go("make")}});
 $("recList").querySelectorAll("[data-pf]").forEach(function(b){b.onclick=function(){var p=find(b.dataset.pf);toPdf(p.title,paperHtml(p))}});
 $("recList").querySelectorAll("[data-dc]").forEach(function(b){b.onclick=function(){var p=find(b.dataset.dc);toDoc(p.title,paperHtml(p))}});
 $("recList").querySelectorAll("[data-dl]").forEach(function(b){b.onclick=function(){if(confirm("刪除這筆紀錄？"))act(del("papers",b.dataset.dl))}});
}

/* ---------- 考古題總集 ---------- */
var addImgs=[],picked={},curIds=[];
function fmtChoice(t,ty){
 t=String(t||"").replace(/\r/g,"");
 var min=/選擇|單選|複選|多選/.test(ty||"")?2:3;
 var re=/[\(（\[【［]?([A-EＡ-Ｅ])\s?[\.．、\)）\]】］:：]/g,ms=[],m;
 while((m=re.exec(t))){
  var c=m[1].charCodeAt(0),k=c>=0xFF21?c-0xFF21:c-65;
  if(k===0&&/[A-Za-z0-9]/.test(t.charAt(m.index-1)))continue;
  ms.push({i:m.index,e:m.index+m[0].length,k:k});
 }
 var st=-1;for(var i=0;i<ms.length;i++){if(ms[i].k===0){st=i;break}}
 if(st<0)return t;
 var seq=[ms[st]];for(var j=st+1;j<ms.length;j++){if(ms[j].k===seq.length)seq.push(ms[j])}
 if(seq.length<min)return t;
 var stem=t.slice(0,seq[0].i).replace(/\s+$/,""),ol=seq.map(function(x,n){var end=n+1<seq.length?seq[n+1].i:t.length;return String.fromCharCode(65+n)+". "+t.slice(x.e,end).replace(/\s+/g," ").trim()});
 return(stem?stem+"\n":"")+ol.join("   ");
}
function qtext(b){return fmtChoice(b.q,b.t)}
function showAdd(v){$("addBox").style.display=v?"":"none";$("addToggle").textContent=v?"收起新增區":"＋ 新增考古題"}
$("addToggle").onclick=function(){showAdd($("addBox").style.display==="none")};
function uniq(a){return a.filter(function(v,i){return v&&a.indexOf(v)===i})}
function opts(el,all,list){var v=el.value;el.innerHTML='<option value="">'+all+"</option>"+list.map(function(x){return '<option value="'+esc(x)+'">'+esc(x)+"</option>"}).join("");el.value=list.indexOf(v)>-1?v:""}
function renderThumbs(){
 $("bThumbs").innerHTML=addImgs.map(function(u,i){return '<span class="th"><img src="'+u+'"><button data-rmimg="'+i+'" title="移除">×</button></span>'}).join("");
 $("bThumbs").querySelectorAll("[data-rmimg]").forEach(function(b){b.onclick=function(){addImgs.splice(+b.dataset.rmimg,1);renderThumbs()}});
}
$("bImg").onchange=function(){
 var fs=Array.prototype.slice.call(this.files);this.value="";
 fs.reduce(function(p,f){return p.then(function(){if(addImgs.length>=4){toast("每題最多 4 張圖片");return}return shrink(f,800).then(function(u){addImgs.push(u)})})},Promise.resolve()).then(renderThumbs).catch(function(){toast("圖片讀取失敗")});
};
function renderBank(){
 var ys=uniq(S.bank.map(function(b){return String(b.y)})).sort().reverse(),cs=uniq(S.bank.map(function(b){return b.c})).sort(),ts=uniq(TYPES.concat(S.bank.map(function(b){return b.t})));
 var us=uniq(S.bank.filter(function(b){return!$("fC").value||b.c===$("fC").value}).map(function(b){return b.u})).sort();
 opts($("fY"),"全部年份",ys);opts($("fC"),"全部科目",cs);opts($("fT"),"全部題型",ts);opts($("fU"),"全部單元",us);
 $("subs").innerHTML=cs.map(function(c){return '<option value="'+esc(c)+'">'}).join("");
 $("types").innerHTML=ts.map(function(c){return '<option value="'+esc(c)+'">'}).join("");
 $("units").innerHTML=uniq(S.bank.map(function(b){return b.u})).map(function(c){return '<option value="'+esc(c)+'">'}).join("");
 var k=$("fK").value.trim(),UM=useMap();
 var l=S.bank.filter(function(b){return(!$("fY").value||String(b.y)===$("fY").value)&&(!$("fC").value||b.c===$("fC").value)&&(!$("fT").value||b.t===$("fT").value)&&(!$("fU").value||b.u===$("fU").value)&&(!k||(b.q+" "+(b.a||"")).indexOf(k)>-1)});
 if($("sortSel").value==="use")l=l.slice().sort(function(a,b){return(UM[b.id]||[]).length-(UM[a.id]||[]).length});
 $("bN").textContent=l.length;$("bD").textContent=nLi();
 curIds=l.map(function(b){return b.id});
 Object.keys(picked).forEach(function(id){if(!S.bank.some(function(b){return b.id===id}))delete picked[id]});
 $("bList").innerHTML=l.length?l.map(function(b){
  var u=UM[b.id]||[];
  return '<label class="item"><input type="checkbox" data-pk="'+b.id+'"'+(picked[b.id]?" checked":"")+'><div class="t">'+(b.imgs||[]).map(function(x){return '<img class="qimg" src="'+x+'">'}).join("")+'<span class="tag">'+esc(b.y)+'</span><span class="tag">'+esc(b.c)+'</span><span class="tag">'+esc(b.t||"未分類")+"</span>"+(b.u?'<span class="tag">'+esc(b.u)+"</span>":"")+'<span class="tag" style="border-color:var(--or2);color:var(--or2)">出過 '+u.length+" 次</span><div>"+esc(qtext(b))+"</div>"+(b.a?'<div class="ans">答案：'+esc(b.a)+"</div>":"")+(b.by&&b.by!=="本機"?'<div class="ans">新增者：'+esc(b.by)+"</div>":"")+(u.length?'<div class="ans">出過的考卷：'+u.map(function(e){return esc(e.t)+"（"+esc(e.d)+"）"}).join("、")+"</div>":"")+"</div></label>";
 }).join(""):'<div class="empty-msg">'+(S.bank.length?"沒有符合篩選的題目。":"題庫是空的，按右上方「＋ 新增考古題」新增第一題。")+"</div>";
 $("bList").querySelectorAll("[data-pk]").forEach(function(x){x.onchange=function(){if(x.checked)picked[x.dataset.pk]=1;else delete picked[x.dataset.pk];selUi()}});
 selUi();
}
["fY","fC","fT","fU","sortSel"].forEach(function(i){$(i).onchange=renderBank});$("fK").oninput=renderBank;
function mode(batch){$("oneBox").style.display=batch?"none":"";$("batBox").style.display=batch?"":"none";$("tS").className="btn sm"+(batch?" ghost":"");$("tB").className="btn sm"+(batch?"":" ghost")}
$("tS").onclick=function(){mode(false)};$("tB").onclick=function(){if(editId)resetEdit();mode(true)};
function resetEdit(){editId=null;addImgs=[];renderThumbs();$("addH").textContent="新增考古題";$("bAdd").textContent="新增題目";$("bCancel").style.display="none";$("bQ").value="";$("bA").value=""}
$("bCancel").onclick=resetEdit;
function selUi(){var n=Object.keys(picked).length;$("selN").textContent="已選 "+n+" 題";$("selAll").checked=!!curIds.length&&curIds.every(function(id){return picked[id]})}
function bankById(id){return S.bank.filter(function(z){return z.id===id})[0]}
function pickedIds(){
 var ids=Object.keys(picked).filter(function(id){return bankById(id)});
 ids.sort(function(a,b){var x=curIds.indexOf(a),y=curIds.indexOf(b);return(x<0?1e9:x)-(y<0?1e9:y)});
 return ids;
}
function need(){var ids=pickedIds();if(!ids.length)toast("請先勾選題目");return ids}
$("selAll").onchange=function(){var on=this.checked;curIds.forEach(function(id){if(on)picked[id]=1;else delete picked[id]});renderBank()};
$("bAddDoc").onclick=function(){
 var ids=need();if(!ids.length)return;
 ids.forEach(function(id){var b=bankById(id);addToDoc(qtext(b),b.a||"",b.imgs,b.id,true)});
 sync();picked={};renderBank();toast("已加入 "+ids.length+" 題到考卷");
};
$("bEdit").onclick=function(){
 var ids=need();if(!ids.length)return;
 if(ids.length>1){$("bkN").textContent=ids.length;["bkY","bkC","bkT","bkU"].forEach(function(i){$(i).value=""});$("bulk").style.display="flex";return}
 var b=bankById(ids[0]);editId=b.id;mode(false);showAdd(true);
 $("bY").value=b.y;$("bC").value=b.c;$("bT").value=b.t||"";$("bU").value=b.u||"";$("bQ").value=b.q;$("bA").value=b.a||"";
 addImgs=(b.imgs||[]).slice();renderThumbs();$("addH").textContent="編輯題目";$("bAdd").textContent="儲存修改";$("bCancel").style.display="";window.scrollTo(0,0);
};
$("bkNo").onclick=function(){$("bulk").style.display="none"};
$("bkOk").onclick=function(){
 var ch={};["y","c","t","u"].forEach(function(k){var v=$("bk"+k.toUpperCase()).value.trim();if(v)ch[k]=v});
 if(!Object.keys(ch).length){toast("沒有填任何要修改的欄位");return}
 var arr=pickedIds().map(function(id){return Object.assign({},bankById(id),ch)});
 $("bulk").style.display="none";
 act(putMany("bank",arr).then(function(){toast("已修改 "+arr.length+" 題")}));
};
$("bDel").onclick=function(){
 var ids=need();if(!ids.length)return;
 if(confirm("刪除已選的 "+ids.length+" 題？所有人都會看不到。"))act(delMany("bank",ids).then(function(){picked={};renderBank()}));
};
$("bFmt").onclick=function(){
 var arr=[];pickedIds().forEach(function(id){var b=bankById(id),q=fmtChoice(b.q,b.t);if(q!==b.q)arr.push(Object.assign({},b,{q:q}))});
 if(!Object.keys(picked).length){toast("請先勾選題目");return}
 if(!arr.length){toast("已選題目沒有需要整理的選擇題");return}
 act(putMany("bank",arr).then(function(){toast("已整理 "+arr.length+" 題")}));
};
function meta(){
 var y=$("bY").value.trim(),c=$("bC").value.trim(),t=$("bT").value.trim();
 if(!y||!c||!t){toast("請先填年份、科目和題型");return null}
 return{y:y,c:c,t:t,u:$("bU").value.trim()};
}
$("bAdd").onclick=function(){
 var m=meta();if(!m)return;var q=$("bQ").value.trim();if(!q&&!addImgs.length){$("bQ").focus();return}
 if(addImgs.join("").length+q.length>900000){toast("圖片太大，超過雲端單題上限，請減少圖片");return}
 var old=editId?S.bank.filter(function(z){return z.id===editId})[0]:null;
 var o=Object.assign({},old||{id:uid()},{q:fmtChoice(q,m.t),a:$("bA").value.trim(),imgs:addImgs.slice()},m);
 var was=!!editId;
 act(putMany("bank",[o]).then(function(){resetEdit();toast(was?"已儲存修改":"已新增")}));
};
function parseBatch(t){
 return t.replace(/\r/g,"").split(/\n\s*\n/).map(function(b){return b.trim()}).filter(Boolean).map(function(b){
  var a="",ls=[];
  b.split("\n").forEach(function(l){var m=l.match(/^\s*(?:答案|解答|Ans(?:wer)?)\s*[:：]\s*(.*)$/i);if(m)a=m[1].trim();else ls.push(l)});
  return{q:ls.join("\n").replace(/^\s*(?:第?\d+\s*[\.、\)）題]|\(\d+\))\s*/,"").trim(),a:a};
 }).filter(function(x){return x.q});
}
$("bB").oninput=function(){var n=parseBatch(this.value).length;$("bCnt").textContent=n?" 目前偵測到 "+n+" 題。":""};
$("bBAdd").onclick=function(){
 var m=meta();if(!m)return;var l=parseBatch($("bB").value);if(!l.length){$("bB").focus();return}
 var base=Date.now();
 var arr=l.map(function(x,i){return Object.assign({id:uid()+i,ts:base-i,q:fmtChoice(x.q,m.t),a:x.a},m)});
 act(putMany("bank",arr).then(function(){$("bB").value="";$("bCnt").textContent="";toast("已新增 "+arr.length+" 題")}));
};

function renderAll(){renderCal();renderEv();renderDraft();renderRec();renderBank()}
init();
